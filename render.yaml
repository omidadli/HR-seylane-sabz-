# Render Blueprint (Infrastructure as Code)
# Node.js Web Service on Render. The app's data layer is an in-memory store
# with a JSON-file snapshot (server/store.ts) — there is no live database
# dependency, so no Postgres instance or DATABASE_URL is required to deploy.

services:
  - type: web
    name: hr-seylane-sabz
    env: node
    plan: starter
    region: oregon
    runtime: node
    repo: https://github.com/omidadli/HR-seylane-sabz-
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
