# Render Blueprint (Infrastructure as Code)
# Push this file to main branch and connect repo on Render Dashboard,
# or deploy via Render CLI: render blueprint apply render.yaml
# This creates both PostgreSQL DB and Web Service linked to this repo.

databases:
  - name: hr-seylane-sabz-db
    databaseName: hr_seylane_db
    user: hr_seylane_user
    plan: starter
    region: oregon
    ipAllowList: []  # Allow Render internal + your IP if needed

services:
  - type: web
    name: hr-seylane-sabz
    env: node
    plan: starter
    region: oregon
    runtime: node
    repo: https://github.com/omidadli/HR-seylane-sabz-
    branch: main
    autoDeploy: true
    buildCommand: npm install && npx prisma generate || echo "prisma not configured" && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: hr-seylane-sabz-db
          property: connectionString
      # Add other env vars from .env.example here if needed (e.g., GEMINI_API_KEY)
      # - key: GEMINI_API_KEY
      #   value: "your-key-here"
