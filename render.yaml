# Render Blueprint (Infrastructure as Code)
# Configured for Node.js Web Service on Render with Supabase PostgreSQL Database

services:
  - type: web
    name: hr-seylane-sabz
    env: node
    plan: starter
    region: oregon
    runtime: node
    repo: https://github.com/omidadli/HR-seylane-sabz-
    branch: main
    autoDeploy: true
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
